name: Release AAB

# Automático: git push de tag v* (ex.: git tag v1.0.1 && git push origin v1.0.1)
# Manual: Actions → Release AAB → Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_verify:
        description: Rodar verifyCi antes do bundle
        type: boolean
        default: true
      upload_play_internal:
        description: Enviar AAB para faixa internal da Play (requer PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require upload keystore secrets
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name não configurado. Veja docs/release.md (Secrets GitHub)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode upload keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run CI verification
        if: ${{ github.event_name == 'push' || inputs.run_verify }}
        run: ./gradlew verifyCi --stacktrace --no-configuration-cache

      - name: Bundle release
        run: ./gradlew :app:bundleRelease --stacktrace --no-configuration-cache

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Opcional: só no dispatch com checkbox, e só se o secret existir.
      - name: Upload to Play internal (draft)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_play_internal }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.unhasdequecor
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft

      - name: Scrub keystore
        if: always()
        run: rm -f "${RELEASE_STORE_FILE:-}"
