name: Release AAB

# Tag v* ou Actions → Release AAB: bump de versão, AAB assinado e publicação na faixa
# internal da Play (status completed) quando PLAY_SERVICE_ACCOUNT_JSON estiver configurado.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_verify:
        description: Rodar verifyCi antes do bundle
        type: boolean
        default: true
      skip_play_upload:
        description: Pular envio para teste interno da Play
        type: boolean
        default: false

concurrency:
  group: release-aab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # completed = publica direto na faixa internal; use draft só se o app ainda estiver
      # "Draft" no Play Console (primeiro upload / listing incompleto).
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require upload keystore secrets
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name não configurado. Veja docs/release.md (Secrets GitHub)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Bump versionCode / versionName
        id: version
        run: |
          set -euo pipefail
          file="app/build.gradle.kts"
          current_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' "$file" | head -1)
          current_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$file" | head -1)
          if [ -z "$current_code" ] || [ -z "$current_name" ]; then
            echo "::error::Não achei versionCode/versionName em $file"
            exit 1
          fi
          next_code=$((current_code + 1))
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            next_name="${GITHUB_REF_NAME#v}"
          else
            maj=$(echo "$current_name" | cut -d. -f1)
            min=$(echo "$current_name" | cut -d. -f2)
            pat=$(echo "$current_name" | cut -d. -f3)
            maj=${maj:-0}
            min=${min:-0}
            pat=${pat:-0}
            next_name="${maj}.${min}.$((pat + 1))"
          fi
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${next_code}/" "$file"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${next_name}\"/" "$file"
          echo "code=${next_code}" >> "$GITHUB_OUTPUT"
          echo "name=${next_name}" >> "$GITHUB_OUTPUT"
          echo "Version → ${next_name} (${next_code})"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # NDK: strip + empacota native debug symbols (aviso Play / MediaPipe .so).
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode upload keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Run CI verification
        if: ${{ github.event_name == 'push' || inputs.run_verify }}
        run: ./gradlew verifyCi --stacktrace --no-configuration-cache

      - name: Bundle release
        run: ./gradlew :app:bundleRelease --stacktrace --no-configuration-cache

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-aab-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # MediaPipe/.so de terceiros costumam vir já stripped → zip pode não existir.
      - name: Locate native debug symbols
        id: native_symbols
        run: |
          set -euo pipefail
          zip="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"
          if [ -f "$zip" ]; then
            echo "path=$zip" >> "$GITHUB_OUTPUT"
            echo "Found $zip ($(wc -c < "$zip") bytes)"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem native-debug-symbols.zip (deps .so já stripped, ex. MediaPipe). O aviso da Play pode continuar; mapping.txt (R8) cobre stack Kotlin/Java."
          fi

      - name: Upload native debug symbols artifact
        if: ${{ steps.native_symbols.outputs.path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-debug-symbols-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: ${{ steps.native_symbols.outputs.path }}
          if-no-files-found: ignore

      # Commit antes do upload: se a Play falhar, a versão já fica gravada e o próximo
      # run não reutiliza o mesmo versionCode.
      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi
          git commit -m "chore(release): ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            git push origin "HEAD:master"
          fi

      - name: Publish to Play internal testing
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && (github.event_name != 'workflow_dispatch' || !inputs.skip_play_upload) }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.unhasdequecor
          releaseFiles: app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: ${{ env.PLAY_RELEASE_STATUS }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          debugSymbols: ${{ steps.native_symbols.outputs.path }}
          whatsNewDirectory: distribution/whatsnew

      - name: Scrub keystore
        if: always()
        run: rm -f "${RELEASE_STORE_FILE:-}"
