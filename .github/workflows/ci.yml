name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (detekt, lint, tests, coverage, assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Exposto no job para o `if` do passo Sonar (token vazio = step pulado).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_QUALITY_GATE_WAIT: ${{ vars.SONAR_QUALITY_GATE_WAIT || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SonarCloud precisa do histórico completo para blame / new code.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Instala o necessário aqui; evita cache manual do SDK (restore tar flaky).
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run CI verification
        run: ./gradlew verifyCi --stacktrace --no-configuration-cache

      - name: Sonar analysis
        # Roda só quando o token estiver configurado (repo secret SONAR_TOKEN).
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --stacktrace --no-configuration-cache

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            app/build/reports/jacoco/jacocoDomainReport/
            app/build/reports/coverage/
          if-no-files-found: ignore

      - name: Upload Detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: |
            app/build/reports/detekt/
            **/build/reports/detekt/
          if-no-files-found: ignore

      - name: Upload Lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
