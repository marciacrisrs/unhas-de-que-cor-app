name: Bootstrap Gradle verification metadata

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Bootstrap verification metadata
        run: ./gradlew --write-verification-metadata sha256 help --no-daemon

      - name: Commit verification metadata
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "Verification metadata is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "build: verify CycloneDX plugin metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
