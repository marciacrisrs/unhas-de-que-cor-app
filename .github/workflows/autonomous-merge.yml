name: Autonomous Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  evaluate:
    name: Evaluate autonomous merge
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          WORKFLOW_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then PR="${WORKFLOW_PR:-}"; else PR="${EVENT_PR:-}"; fi
          [[ -z "$PR" ]] && { echo "No pull request associated with this event."; exit 0; }
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Inspect pull request
        id: inspect
        if: steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          DATA=$(gh api "repos/${{ github.repository }}/pulls/$PR")
          STATE=$(jq -r '.state' <<<"$DATA")
          DRAFT=$(jq -r '.draft' <<<"$DATA")
          MERGEABLE=$(jq -r '.mergeable' <<<"$DATA")
          ACTOR=$(jq -r '.user.login' <<<"$DATA")
          TITLE=$(jq -r '.title' <<<"$DATA")
          HEAD_SHA=$(jq -r '.head.sha' <<<"$DATA")
          NODE_ID=$(jq -r '.node_id' <<<"$DATA")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "node_id=$NODE_ID" >> "$GITHUB_OUTPUT"
          echo "dependabot_action_pr=false" >> "$GITHUB_OUTPUT"
          [[ "$STATE" == "open" && "$DRAFT" == "false" && "$MERGEABLE" != "false" ]]

          FILES_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR/files?per_page=100" --paginate)

          if [[ "$ACTOR" == "dependabot[bot]" && "$TITLE" =~ ^build\(deps\) ]]; then
            BAD=0
            FOUND=0
            mapfile -t FILES < <(jq -r '.[].filename' <<<"$FILES_JSON")

            for FILE in "${FILES[@]}"; do
              if [[ ! "$FILE" =~ ^\.github/workflows/.*\.ya?ml$ ]]; then
                echo "::error::Dependabot action PR changed a non-workflow file: $FILE"
                BAD=1
                continue
              fi

              PATCH=$(jq -r --arg file "$FILE" '.[] | select(.filename == $file) | .patch // ""' <<<"$FILES_JSON")
              [[ -n "$PATCH" ]] || { echo "::error::No patch available for $FILE"; BAD=1; continue; }

              while IFS= read -r LINE; do
                [[ "$LINE" =~ ^(\+\+\+|---|@@) ]] && continue
                [[ "$LINE" =~ ^[+-] ]] || continue
                if [[ ! "$LINE" =~ ^[+-][[:space:]]*uses:[[:space:]]*[^[:space:]@]+@[0-9a-fA-F]{40}([[:space:]]*#.*)?$ ]]; then
                  echo "::error::Dependabot PR contains a non-action-reference change in $FILE: $LINE"
                  BAD=1
                else
                  FOUND=1
                fi
              done <<< "$PATCH"

              OLD_ACTIONS=$(grep -E '^-[[:space:]]*uses:' <<<"$PATCH" | sed -E 's/^[^u]*uses:[[:space:]]*([^@[:space:]]+)@.*/\1/' | sort || true)
              NEW_ACTIONS=$(grep -E '^\+[[:space:]]*uses:' <<<"$PATCH" | sed -E 's/^[^u]*uses:[[:space:]]*([^@[:space:]]+)@.*/\1/' | sort || true)
              if [[ "$OLD_ACTIONS" != "$NEW_ACTIONS" ]]; then
                echo "::error::Dependabot action name changed in $FILE; only the pinned revision may change."
                BAD=1
              fi
            done

            if (( BAD != 0 || FOUND == 0 )); then
              echo "Dependabot PR is not a pure GitHub Actions reference update; autonomous merge is disabled."
              exit 1
            fi

            echo "dependabot_action_pr=true" >> "$GITHUB_OUTPUT"
            echo "Validated Dependabot PR: workflow files contain only pinned GitHub Actions reference changes."
          else
            mapfile -t SENSITIVE < <(jq -r '.[].filename' <<<"$FILES_JSON" | grep -E '^(.github/|.*(Dockerfile|docker-compose|compose\.ya?ml)$)' || true)
            if (( ${#SENSITIVE[@]} > 0 )); then
              echo "Sensitive files changed; autonomous merge is disabled."
              printf '%s\n' "${SENSITIVE[@]}"
              exit 1
            fi
          fi

      - name: Verify CodeRabbit approval for current commit
        if: steps.inspect.outcome == 'success' && steps.inspect.outputs.dependabot_action_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.inspect.outputs.head_sha }}
        run: |
          set -euo pipefail
          STATE=$(SHA="$SHA" gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate --jq '[.[] | select(.user.login | test("coderabbit"; "i")) | select(.commit_id == env.SHA)] | sort_by(.submitted_at) | last | .state // ""')
          echo "CodeRabbit review for $SHA: ${STATE:-none}"
          [[ "$STATE" == "APPROVED" ]]

      - name: Verify every completed check on current commit
        if: steps.inspect.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.inspect.outputs.head_sha }}
        run: |
          set -euo pipefail
          TOTAL=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --paginate --jq '[.check_runs[] | select(.name != "Evaluate autonomous merge") | select(.name | test("CodeRabbit"; "i") | not)] | length')
          [[ "$TOTAL" -gt 0 ]] || { echo "No CI checks found for current commit."; exit 1; }
          FAILING=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --paginate --jq '.check_runs[] | select(.name != "Evaluate autonomous merge") | select(.name | test("CodeRabbit"; "i") | not) | select(.status != "completed" or (.conclusion != "success" and .conclusion != "skipped")) | .name' || true)
          if [[ -n "$FAILING" ]]; then
            echo "Blocking or incomplete checks:"
            echo "$FAILING"
            exit 1
          fi

      - name: Enable GitHub auto-merge only
        if: steps.inspect.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ steps.inspect.outputs.node_id }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='mutation($pr:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pr,mergeMethod:SQUASH}){pullRequest{autoMergeRequest{enabledAt}}}}' \
            -F pr="$PR_NODE_ID"
